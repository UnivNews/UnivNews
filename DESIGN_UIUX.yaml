# =========================================================
# University News Portal — UI/UX Design Spec (cleaned)
# Page: HOMEPAGE — v2 (supersedes the previous "For You" list version;
#       layout changed to a 2x2 card grid + sidebar with trending/ad slots)
# Shares tokens with: design-spec.yaml (Research & Innovation page)
# =========================================================


meta:
  name: University News Portal
  page: Homepage
  version_note: >
    This replaces the earlier homepage spec that used a single-column
    "For You" article list. The new source data shows "Recent News" as a
    2x2 card grid with a sidebar (Trending News + Advertisement slot) —
    same pattern as the Research & Innovation page's sidebar.
  style: editorial / academic / newsroom, sharp corners, minimal shadow

# ---------------------------------------------------------
# ⚠️ COLOR DRIFT — FLAGGED, NOT AUTO-MERGED
# ---------------------------------------------------------
# This export introduces near-duplicate colors that are close to, but not
# identical to, tokens already established. Likely cause: re-exported from
# Figma in a different session where the color picker landed a few values
# off. Recommend consolidating to ONE canonical set before handing to the
# coding agent — otherwise Tailwind config ends up with near-duplicate
# color utilities that are impossible to tell apart later.
color_drift_flags:
  - new: "#0A1F44"
    used_for: "Header/TopNavBar background (this file)"
    conflicts_with: "primary_navy #00081E (used everywhere else: breaking news bg, footer bg, pagination active state)"
    recommendation: "Almost certainly should just BE primary_navy. Confirm with design source; if no intentional reason, replace with #00081E."
  - new: "#F6F3F4"
    used_for: "Sidebar 'Aside' widget background (trending news container) on homepage"
    conflicts_with: "surface_alt #F0EDEE (used for card backgrounds, filter dropdown bg elsewhere)"
    recommendation: "Close enough to be a rounding difference — consolidate to surface_alt unless there's a deliberate reason for a 2nd neutral tone."
  - new: "#EAE7E8"
    used_for: "Advertisement placeholder box background"
    conflicts_with: "surface_alt #F0EDEE"
    recommendation: "Same as above — likely should be surface_alt, or if a 3rd neutral tone is genuinely wanted, name it explicitly (e.g. surface_muted) instead of letting it float as an unnamed one-off."
  - new: "#4C5E86"
    used_for: "Pagination 'NEWER' link icon + text color"
    conflicts_with: "text_secondary_on_dark #7687B2 (used for excerpt/footer text on dark bg) — different context here since pagination sits on light background, so this may legitimately need its own token"
    recommendation: "This one might be intentional (muted blue for a light-bg context vs the dark-bg one) — but name it as its own token rather than an unlabeled hex, e.g. text_muted_link."

# ---------------------------------------------------------
# DESIGN TOKENS
# ---------------------------------------------------------
tokens:
  color:
    primary_navy: "#00081E"
    header_navy: "#0A1F44"          # ⚠️ see color_drift_flags — confirm vs primary_navy
    crimson: "#B71032"
    background: "#FCF8F9"
    surface: "#FFFFFF"
    surface_alt: "#F0EDEE"
    surface_alt_2: "#F6F3F4"        # ⚠️ near-duplicate of surface_alt, see flags
    surface_muted: "#EAE7E8"        # ⚠️ near-duplicate of surface_alt, see flags
    text_primary: "#1B1B1C"
    text_secondary: "#44464E"
    text_secondary_on_dark: "#7687B2"
    text_muted_link: "#4C5E86"      # ⚠️ near-duplicate of text_secondary_on_dark, see flags
    border: "#C5C6CF"

  typography:
    heading_font: "Montserrat"
    body_font: "Source Serif 4"
    utility_font: "Work Sans"

  radius:
    default: 0px
    pagination_button: 4px          # deviation from global 0px rule — carried over from prior spec
    widget_card: 8px                # NEW deviation — Aside/Trending widget + Ad box both use 8px here
    circular: 9999px

  border:
    default: "1px solid #C5C6CF"

# ---------------------------------------------------------
# ⚠️ RESPONSIVE CONTAINER STRATEGY (fixes the "too big/small on
# different laptops at 100% zoom" problem)
# ---------------------------------------------------------
responsive_container:
  problem: >
    The raw Figma export encodes FIXED pixel widths (1280px for the page,
    1200px for inner sections) because that's the artboard size at design
    time — it is a reference size, not a literal CSS width. Implemented
    as-is (fixed px container), the page renders correctly ONLY at exactly
    that browser width: it floats tiny in a sea of white space on wider
    laptops/monitors, and forces horizontal scroll on narrower ones. This
    is the direct cause of the "kebesaran/kekecilan" issue.
  fix:
    page_container:
      max_width: 1280px
      width: 100%
      margin_inline: auto            # centers on any screen wider than max_width
      padding_inline: 40px           # matches the 40px side padding used throughout the source data
      tailwind_equivalent: 'className="max-w-[1280px] w-full mx-auto px-6 md:px-10"'
    inner_sections:
      note: >
        Sections like "Research Archive Section" (width:1200 in source) are
        just this same container with slightly less internal padding — do
        NOT give them their own separate fixed width. Nest them inside the
        same page_container and let padding_inline handle the difference.
    behavior_across_laptops:
      - screen: "13\" laptop (~1280px logical width, e.g. MacBook Air)"
        result: "container hits max_width almost exactly — minimal/no side margin"
      - screen: "14–16\" laptop (~1440–1512px logical width)"
        result: "container caps at 1280px, centered, ~80–120px margin each side — this is expected and correct, not a bug"
      - screen: "external monitor / 1920px+"
        result: "container still caps at 1280px, centered — content never stretches full-bleed, keeping line-length readable"
      rule: "Because it's max-width + mx-auto, the page renders IDENTICALLY across all of these — never bigger, never smaller, just more/less side margin. This is what makes it 'rapih' at 100% zoom on any laptop."
    below_max_width:
      breakpoint: "< 1280px"
      behavior: "container naturally shrinks to width:100% with the same padding_inline; grid columns collapse per component (see recent_news_section.main_grid.responsive)"

# ---------------------------------------------------------
# HEADER / NAV
# ---------------------------------------------------------
header_nav:
  background: header_navy    # ⚠️ flagged — see color_drift_flags, likely should be primary_navy
  container: page_container (see responsive_container)
  layout: [nav_links, spacer, search_input, divider, login_link]

  nav_links:
    - label: "HOME"
      state: active
      active_style: { color: crimson, border_bottom: "1px solid crimson" }
    - label: "ACHIEVEMENTS"
      style: { color: "#FFFFFF" }
    - label: "EVENTS"
      style: { color: "#FFFFFF" }
    - label: "RESEARCH & INNOVATION"
      style: { color: "#FFFFFF" }

  search_input:
    placeholder: "Search news..."
    background: surface
    icon: search, color: text_secondary_on_dark
    radius: 0

  divider: { style: "1px solid border", vertical: true }

  login_link:
    label: "Login"
    style: { font: utility_font, weight: 600, color: "#FFFFFF" }

  responsive:
    tablet_and_below: "collapse nav_links into hamburger; search collapses to icon-only that expands on tap"

# ---------------------------------------------------------
# BREAKING NEWS SECTION (hero area) — unchanged from prior version
# ---------------------------------------------------------
breaking_news_section:
  background: primary_navy
  container: page_container
  padding_block: "32px 48px"

  label:
    icon: { shape: dot, color: crimson }
    text: "BREAKING FOCUS"
    style: { font: utility_font, weight: 600, color: crimson, uppercase: true }

  layout: 2-column, [hero_article (wide, left), sidebar_articles (narrow, right)]

  hero_article:
    image:
      fill: true, aspect: wide
      overlay: gradient (dark, bottom-to-transparent)
    content:
      position: overlay, bottom-left
      category: { text: "Campus Development", color: crimson, style: uppercase, weight: 600 }
      headline:
        text: "University Unveils Comprehensive Master Plan for Innovation District"
        style: { font: heading_font, weight: 700, size: 32px, color: "#FFFFFF" }
      excerpt:
        text: "The ambitious 10-year initiative aims to bridge historical academic precincts with cutting-edge industry partnerships, transforming the campus output into a hub for…"
        style: { font: body_font, size: 17px, color: text_secondary_on_dark }

  sidebar_articles:
    layout: vertical list, divided by bottom border (except last item)
    item:
      category: { style: { font: utility_font, weight: 600, color: crimson, uppercase: true } }
      headline: { style: { font: heading_font, weight: 600, size: 24px, color: "#FFFFFF" } }
      excerpt: { style: { font: body_font, size: 14px, color: text_secondary_on_dark } }
    items:
      - category: "RESEARCH"
        headline: "Breakthrough in Quantum Computing Lab Announced"
        excerpt: "Researchers have stabilized a qubit state at room temperature, a significant step forward in practical quantum applications."
      - category: "ADMINISTRATION"
        headline: "New Dean Appointed for the College of Arts and Letters"
        excerpt: "Dr. Elena Restova brings over two decades of interdisciplinary humanities expertise to the institution."

  responsive:
    tablet_and_below: "hero_article stacks above sidebar_articles, both full width"

# ---------------------------------------------------------
# NEWS TICKER — ⚠️ ANIMATED, KEEP THE MOTION (per earlier request, unchanged)
# ---------------------------------------------------------
news_ticker:
  background: crimson
  full_bleed: true   # this bar spans full browser width, NOT capped by page_container
  behavior: >
    MOVING MARQUEE, NOT STATIC TEXT. Horizontally auto-scrolling, continuous,
    infinite loop, constant speed. Do NOT render as a fixed static row.
  implementation_note: >
    CSS keyframe translateX on a flex row duplicating its content once for a
    seamless loop; pause on hover for readability. Pure CSS is enough —
    Alpine.js only if you want a manual pause/play toggle.
  accessibility_note: "Respect prefers-reduced-motion — fall back to static or slow scroll."
  item:
    icon: small icon per item
    text_style: { font: utility_font, weight: 600, color: "#FFFFFF", uppercase: true }
    separator: "|" character, color: "#FFFFFF"
  items:
    - "CAMPUS TRANSIT DELAYS EXPECTED ON SOUTH ROUTE TODAY"
    - "REGISTRATION FOR FALL SEMESTER OPENS NEXT TUESDAY AT 8:00 AM"

# ---------------------------------------------------------
# "RECENT NEWS" SECTION — ⚠️ CHANGED from previous "For You" vertical
# list layout to a 2x2 card grid + sidebar (trending + ad slot)
# ---------------------------------------------------------
recent_news_section:
  container: page_container
  padding_block: "80px 40px"

  section_header:
    text: "Recent News"
    style: { font: heading_font, weight: 600, size: 32px, color: primary_navy }
    border_bottom: default

  layout:
    desktop: "2-column: main_grid (fill) + sidebar (fixed reference ~360px, but see responsive)"
    tailwind_equivalent: 'className="grid grid-cols-1 lg:grid-cols-[1fr_360px] gap-12"'

  main_grid:
    columns: { desktop: 2, tablet: 2, mobile: 1 }
    tailwind_equivalent: 'className="columns-1 sm:columns-2 gap-6 space-y-6"'
    layout_type: masonry
    gap: default
    card:
      background: surface
      border: default
      layout: vertical (image on top, content below, dynamic height with break-inside-avoid)
      image: { aspect: "dynamic", fill: true }
      content:
        padding: large (24px)
        meta_row: { category: { color: crimson, uppercase: true, weight: 600, size: 12px }, date: { color: text_secondary, size: 12px } }
        headline: { style: { font: heading_font, weight: 600, size: 18px, color: primary_navy } }
        excerpt: { style: { font: body_font, size: 14px, color: text_secondary } }
    sample_items:
      - category: "STUDENT ACHIEVEMENTS", date: "Oct 26", title: "Urban Ecology Study Reveals Surprising Biodiversity"
      - category: "EVENTS", date: "Oct 25", title: "New Pathways in Memory Formation Discovered"
      - category: "RESEARCH & INNOVATION", date: "Oct 24", title: "Sustainable Robotics Initiative Receives Major Grant"
    note: >
      6 cards in this version using a masonry layout (CSS columns) instead of a strict 2x2 grid. 
      Card heights dynamically adjust to image thumbnails to prevent empty gaps.

  pagination:
    prev: { label: "NEWER", icon: arrow_left, color: text_muted_link }
    pages:
      - { label: "1", state: active, background: primary_navy, text_color: "#FFFFFF", size: "40x40", radius: pagination_button, align: center }
      - { label: "2", size: "40x40", radius: pagination_button, align: center }
      - { label: "3", size: "40x40", radius: pagination_button, align: center }
      - { label: "...", disabled: true }
      - { label: "12", size: "40x40", radius: pagination_button, align: center }
    next: { label: "OLDER", icon: arrow_right, color: primary_navy }
    divider: border-top
    tailwind_equivalent: 'each page button: className="w-10 h-10 flex items-center justify-center rounded"'

  sidebar:
    trending_news_widget:
      background: surface_alt_2   # ⚠️ flagged — likely should just be surface_alt (#F0EDEE), see color_drift_flags
      radius: widget_card          # ⚠️ 8px — deviates from global 0px rule, flagged
      padding: large
      header:
        bullet: { shape: dot, color: crimson }
        title: "TRENDING NEWS"
        style: { font: heading_font, weight: 700, color: primary_navy }
      item:
        index: { format: "01", color: text_secondary_on_dark, weight: 700 }
        title: { font: heading_font, weight: 600, size: 15px, color: primary_navy }
        tag: { font: utility_font, color: text_secondary, uppercase: true }
      items:
        - { index: "01", title: "Breakthrough in Quantum Computing Achieved by Engineering Faculty", tag: "Technology" }
        - { index: "02", title: "New Study Links Urban Green Spaces to Lower Stress Levels in Students", tag: "Health & Wellness" }
        - { index: "03", title: "Annual Arts Festival Draws Record-Breaking Crowd This Weekend", tag: "Campus Life" }
        - { index: "04", title: "Researchers Discover Novel Enzyme that Breaks Down Microplastics", tag: "Environment" }
        - { index: "05", title: "University Announces Groundbreaking $50M Endowment for Scholarships", tag: "Administration" }
      note: >
        This is the SAME widget component/content as the "Trending Research"
        sidebar on the Research & Innovation page — build it once as a
        reusable Blade component (e.g. <x-trending-widget :items="$items"
        :title="$title" />) fed by different data/title per page, rather
        than duplicating markup.

    advertisement_slot:
      label:
        bullet: { shape: dot, color: crimson }
        text: "ADVERTISEMENT"
        style: { font: utility_font, weight: 600, color: text_secondary, uppercase: true }
      box:
        background: surface_muted   # ⚠️ flagged — likely should be surface_alt, see color_drift_flags
        border: default
        radius: widget_card          # ⚠️ 8px, flagged
        content_placeholder: "SPONSOR CONTENT"
        icon: muted, color: border
      implementation_note: >
        Build as a Blade component accepting ad creative (image/HTML/embed
        code) rather than hardcoding placeholder text — this is a real ad
        slot, not decorative content.

  responsive:
    below_lg: "sidebar moves below main_grid, full width; trending_news_widget and advertisement_slot stack vertically"
    mobile: "main_grid collapses to 1 column; card image stays full width above content"

# ---------------------------------------------------------
# FOOTER — unchanged from prior version
# ---------------------------------------------------------
footer:
  background: primary_navy
  border_top: "1px solid crimson"
  container: page_container
  columns:
    branding:
      title: { text: "University News", color: "#FFFFFF" }
      text:
        content: "Providing authoritative reporting and intellectual discourse for the academic community since 1893."
        color: text_secondary_on_dark
    resources:
      heading: { text: "RESOURCES", color: crimson }
      links: ["Faculty Experts", "Media Relations", "Archives"]
    social:
      heading: { text: "SOCIAL", color: crimson }
      links: ["Newsletter", "Podcasts", "Events"]
    institution:
      heading: { text: "INSTITUTION", color: crimson }
      links: ["About the University", "Admissions", "Giving"]
  bottom_bar:
    border_top: default
    copyright:
      text: "© 2024 University News Portal. All academic rights reserved."
      color: text_secondary_on_dark
    links: ["Privacy Policy", "Accessibility"]

# ---------------------------------------------------------
# GENERAL RESPONSIVE RULES (applies site-wide)
# ---------------------------------------------------------
responsive:
  rule_1: "Every section's outer wrapper uses page_container (max-w-[1280px] mx-auto) — never a raw fixed px width."
  rule_2: "News ticker and header/footer backgrounds are full-bleed (100% viewport width); only their INNER content row is capped by page_container."
  rule_3: "Never allow horizontal overflow from fixed desktop widths carried over from the Figma export — those numbers are reference sizes, not CSS values."
  rule_4: "Test at minimum: 1280px, 1440px, 1536px, 1920px logical widths — container size and grid columns should look identical in proportion at all of them, per responsive_container.behavior_across_laptops."

